<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PropertyHub | Premium Real Estate</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">Property<span>Hub</span></div>
    <nav>
      <a href="#">Listings</a>
      <a href="#">Agents</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="container">
    <section class="hero">
      <h1>Find Your Dream Property</h1>
      <p>Explore luxury homes, modern apartments, and prime estates.</p>
    </section>

    <!-- Dynamic Property Listings Grid -->
    <section class="property-grid" id="propertyContainer">
      <!-- Loading placeholder while fetching from database -->
      <p style="text-align: center; grid-column: 1 / -1; color: #94a3b8;">Loading properties from database...</p>
    </section>
  </main>

  <!-- Modern Split Modal View -->
  <div id="propertyModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeProperty()">&times;</span>
      
      <div class="split-view">
        <!-- LEFT SIDE: Info -->
        <div class="info-side">
          <span class="badge">Featured Property</span>
          <h2 id="modalTitle">Property Title</h2>
          <div class="modal-price" id="modalPrice">$0</div>
          <p class="specs" id="modalSpecs">Specs info</p>
          <hr style="border-color: #334155; margin: 1rem 0;">
          <p class="description" id="modalDesc">Detailed description goes here...</p>
          <button class="btn-primary">Schedule a Viewing</button>
        </div>

        <!-- RIGHT SIDE: Image -->
        <div class="image-side">
          <img id="modalImg" src="" alt="Property Detail">
        </div>
      </div>

    </div>
  </div>

  <script>
    // 1. Fetch properties dynamically from backend API / database
    async function fetchProperties() {
      const container = document.getElementById('propertyContainer');
      
      try {
        // Adjust the port/URL to match your backend API endpoint
        const response = await fetch('http://localhost:5000/api/properties');
        
        if (!response.ok) {
          throw new Error('Failed to load data');
        }

        const properties = await response.json();

        if (properties.length === 0) {
          container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">No properties found in database.</p>';
          return;
        }

        // Render each property card into the HTML grid
        container.innerHTML = properties.map(property => `
          <div class="card" onclick="openProperty(
            '${escapeQuotes(property.title)}', 
            '${escapeQuotes(property.price)}', 
            '${escapeQuotes(property.specs)}', 
            '${escapeQuotes(property.description)}', 
            '${escapeQuotes(property.image_url)}'
          )">
            <img src="${property.image_url}" alt="${property.title}">
            <div class="card-info">
              <span class="price">${property.price}</span>
              <h3>${property.title}</h3>
              <p>${property.specs}</p>
            </div>
          </div>
        `).join('');

      } catch (error) {
        console.error('Error fetching properties:', error);
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: #f87171;">
            <p>Could not connect to database API.</p>
            <small>Make sure your backend API is running on port 5000.</small>
          </div>
        `;
      }
    }

    // Helper function to safely escape quotes in dynamic text strings
    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // 2. Open split-view modal with selected property data
    function openProperty(title, price, specs, desc, imgSrc) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalPrice').innerText = price;
      document.getElementById('modalSpecs').innerText = specs;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('propertyModal').style.display = 'flex';
    }

    // 3. Close modal function
    function closeProperty() {
      document.getElementById('propertyModal').style.display = 'none';
    }

    // Execute fetch on page load
    fetchProperties();
  </script>
</body>
</html>
